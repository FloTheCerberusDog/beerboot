<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BeerBoot</title>
  <meta name="description" content="Beer pub crawls in São Paulo you can follow on foot, or build your own.">
  <meta name="theme-color" content="#0d5c3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BeerBoot">
  <script>try{var t=localStorage.getItem("beerboot.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/maplibre-gl-5.24.0.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar gutter">
    <a class="logo" href="index.html"><span data-logo></span>BeerBoot</a>
    <div class="top-actions">
      <div class="lang-switch" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="round round-sm" id="theme-toggle" data-i18n-label="theme"></button>
    </div>
  </header>

  <main class="home gutter">
    <p class="notice" id="demo-notice" hidden data-i18n="demoNotice"></p>

    <section class="hero">
      <p class="eyebrow" data-i18n="heroEyebrow"></p>
      <h1 class="display"><span data-i18n="heroLine1"></span><br><span data-i18n="heroLine2"></span><br><em data-i18n="heroLine3"></em></h1>
      <p class="lede" data-i18n="heroLede"></p>
      <div class="hero-actions">
        <a class="btn btn-gold" href="create.html"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="createCrawl"></span></a>
        <a class="btn btn-ghost" href="create.html#near"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg><span data-i18n="nearMe"></span></a>
      </div>
    </section>

    <section>
      <div class="section-head"><h2 data-i18n="featured"></h2></div>
      <ul class="cards" id="featured"></ul>
    </section>

    <section>
      <div class="section-head"><h2 data-i18n="myRoutes"></h2></div>
      <ul class="cards" id="mine"></ul>
      <p class="footnote" data-i18n="savedOnDevice"></p>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="data/path.js"></script>
  <script src="data/routes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
