<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>São Paulo Pub Crawl</title>
  <meta name="description" content="Beer pub crawl routes you can follow on foot.">
  <link rel="stylesheet" href="vendor/leaflet-1.9.4.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-scroll">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">🍺</span>
      <span class="brand-name">Pub Crawl</span>
    </a>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="home">
    <p class="warning" id="demo-notice" hidden data-i18n="demoNotice"></p>

    <section class="hero">
      <h1 data-i18n="homeTitle"></h1>
      <p class="lede" data-i18n="homeLede"></p>
      <a class="button" href="create.html">＋ <span data-i18n="createRoute"></span></a>
    </section>

    <section>
      <h2 data-i18n="featured"></h2>
      <ul class="cards" id="featured"></ul>
    </section>

    <section>
      <h2 data-i18n="myRoutes"></h2>
      <ul class="cards" id="mine"></ul>
      <p class="footnote" data-i18n="savedOnDevice"></p>
    </section>
  </main>

  <!-- Leaflet is loaded here only because common.js uses its distance helper -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/path.js"></script>
  <script src="data/routes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
