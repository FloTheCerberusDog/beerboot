<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a Route</title>
  <meta name="description" content="Build your own pub crawl route.">
  <link rel="stylesheet" href="vendor/leaflet-1.9.4.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">🍺</span>
      <span class="brand-name">BeerBoot</span>
    </a>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <div id="map" class="map" role="region" aria-label="Map"></div>

    <section class="panel">
      <a class="back-link" href="index.html" data-i18n="allRoutes"></a>
      <h1 id="page-title"></h1>

      <label class="field-label" for="route-name" data-i18n="routeName"></label>
      <input class="input" id="route-name" type="text" maxlength="80" autocomplete="off" data-i18n-placeholder="routeNamePlaceholder">

      <label class="field-label" for="search" data-i18n="searchLabel"></label>
      <input class="input" id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
      <p class="hint" data-i18n="searchHint"></p>
      <p class="status" id="search-status" role="status"></p>
      <ul class="results" id="results"></ul>

      <dl class="stats">
        <div><dt data-i18n="stops"></dt><dd id="stat-stops"></dd></div>
        <div><dt data-i18n="distance"></dt><dd id="stat-distance"></dd></div>
        <div><dt data-i18n="walking"></dt><dd id="stat-walking"></dd></div>
      </dl>

      <ol class="stops" id="stops"></ol>
      <p class="warning" id="many-stops" hidden></p>

      <div class="actions">
        <button class="button" type="button" id="save" data-i18n="save"></button>
        <a class="button-text" href="index.html" data-i18n="cancel"></a>
      </div>
      <p class="status error" id="save-status" role="alert"></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/path.js"></script>
  <script src="data/routes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
