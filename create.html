<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Create a Crawl · BeerBoot</title>
  <meta name="description" content="Build your own beer pub crawl in São Paulo.">
  <meta name="theme-color" content="#0d5c3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BeerBoot">
  <script>try{var t=localStorage.getItem("beerboot.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/maplibre-gl-5.24.0.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="map-page">
    <div class="map-wrap">
      <div id="map" class="map" role="region" aria-label="Map"></div>
      <div class="map-buttons gutter">
        <a class="round" href="index.html" data-i18n-label="allRoutes"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
        <div class="group">
          <div class="lang-switch" role="group" aria-label="Language / Idioma">
            <button type="button" data-lang="pt">PT</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button type="button" class="round" id="theme-toggle" data-i18n-label="theme"></button>
          <button type="button" class="round" id="locate-btn" data-i18n-label="locate"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        </div>
      </div>
    </div>

    <section class="sheet gutter">
      <div class="grabber"></div>
      <div class="sheet-head">
        <p class="eyebrow">BeerBoot</p>
        <h1 class="display" id="page-title"></h1>
      </div>

      <div class="field">
        <label class="field-label" for="route-name" data-i18n="routeName"></label>
        <input class="input" id="route-name" type="text" maxlength="80" autocomplete="off" data-i18n-placeholder="routeNamePlaceholder">
      </div>

      <div class="field">
        <label class="field-label" for="search" data-i18n="searchLabel"></label>
        <div class="search-box">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="input" id="search" type="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="searchPlaceholder">
        </div>
        <p class="hint" id="search-hint" data-i18n="searchHint"></p>
        <p class="status" id="search-status" role="status"></p>
        <ul class="results" id="results"></ul>
      </div>

      <div class="stat-row">
        <div class="stat"><b id="stat-stops"></b><span data-i18n="statBars"></span></div>
        <div class="stat"><b id="stat-distance"></b><span data-i18n="statDistance"></span></div>
        <div class="stat"><b id="stat-walking"></b><span data-i18n="statWalking"></span></div>
      </div>

      <div class="tools-row" id="tools-row" hidden>
        <button type="button" class="btn btn-ghost btn-small" id="best-order"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-sparkle"/></svg><span data-i18n="bestOrder"></span></button>
      </div>

      <ol class="timeline" id="stops"></ol>
      <p class="warning" id="many-stops" hidden data-i18n="manyStops"></p>

      <div class="actions-row">
        <button class="btn btn-gold btn-block" type="button" id="save"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="save"></span></button>
        <a class="btn btn-ghost" href="index.html" data-i18n="cancel"></a>
      </div>
      <p class="status error" id="save-status" role="alert"></p>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="data/path.js"></script>
  <script src="data/routes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/create.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
