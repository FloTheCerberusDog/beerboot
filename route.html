<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pub Crawl Route</title>
  <meta name="description" content="A beer pub crawl route you can follow on foot.">

  <!-- Leaflet: the library that draws the map -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">🍺</span>
      <span class="brand-name">Pub Crawl</span>
    </a>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <div id="map" class="map" role="region" aria-label="Map"></div>

    <section class="panel">
      <div class="panel-nav">
        <a class="back-link" href="index.html" data-i18n="allRoutes"></a>
        <a class="button-text" id="edit-link" hidden data-i18n="edit"></a>
      </div>

      <div id="route-content">
        <p class="eyebrow" id="route-city"></p>
        <h1 id="route-title"></h1>
        <p class="lede" id="route-description"></p>

        <dl class="stats">
          <div><dt data-i18n="stops"></dt><dd id="stat-stops"></dd></div>
          <div><dt data-i18n="distance"></dt><dd id="stat-distance"></dd></div>
          <div><dt data-i18n="walking"></dt><dd id="stat-walking"></dd></div>
        </dl>

        <ol class="stops" id="stops"></ol>

        <p class="footnote" data-i18n="footnote"></p>
      </div>

      <p class="empty" id="not-found" hidden data-i18n="routeNotFound"></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/path.js"></script>
  <script src="data/routes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/route.js"></script>
</body>
</html>
